[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "counters"
# Mirrors Counterparty Core — see counters/__init__.py, the single source.
dynamic = ["version"]
description = "Bitcoin Counters v3 — Counterparty taproot-envelope file-event indexer, CLI, and wallet"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "mnemonic>=0.20",
    "ecdsa>=0.18",
]

[project.scripts]
counters = "counters.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "counters.__version__"}

[tool.setuptools.packages.find]
include = ["counters*"]

[tool.setuptools.package-data]
"counters.server" = ["static/*"]
"counters" = ["electrum1_words.txt"]
